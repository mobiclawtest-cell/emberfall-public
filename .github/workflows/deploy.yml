name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import project source
        id: import
        run: |
          set +e
          mkdir -p .ci
          LOG=.ci/status.txt
          : > "$LOG"
          say() { echo "$@" | tee -a "$LOG"; }
          if [ -f src/App.tsx ]; then
            say "Source already present - skipping import."
            exit 0
          fi
          say "Source missing - importing..."
          DEST=/tmp/imported
          rm -rf "$DEST"
          mkdir -p "$DEST"
          OK=""
          for URL in "https://n.uguu.se/kLuqrpol.tar.gz" "https://pomf2.lain.la/f/cpu08ag1.tar.gz" "https://qu.ax/wClA9" "https://filebin.net/emberfall9x7q/ef-src.tar.gz"; do
            say "trying $URL"
            if curl -fsSL --retry 2 --retry-all-errors --max-time 150 -o /tmp/src.tgz "$URL"; then
              say "downloaded $(wc -c < /tmp/src.tgz) bytes"
              if tar xzf /tmp/src.tgz -C "$DEST" 2>>"$LOG"; then
                say "extracted OK"
                OK=1
                break
              else
                say "extract failed"
              fi
            else
              say "download failed"
            fi
          done
          if [ -z "$OK" ]; then
            say "ALL MIRRORS FAILED"
            exit 0
          fi
          for f in index.html tsconfig.json vite.config.ts README.md; do
            if [ -f "$DEST/$f" ]; then cp -f "$DEST/$f" .; say "copied $f"; fi
          done
          rm -rf src
          cp -r "$DEST/src" src
          say "copied src ($(find src -type f | wc -l) files)"
          say "import complete"

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 20

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        id: tc
        run: npx tsc --noEmit

      - name: Build site
        id: build
        run: npx vite build

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages API diagnostics and explicit enable
        id: enable
        if: always()
        run: |
          set +e
          mkdir -p .ci
          R="${{ github.repository }}"
          T="${{ secrets.GITHUB_TOKEN }}"
          {
            echo "--- pages diagnostics ---"
            echo "GET /pages:"
            curl -s -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$R/pages"
            echo "POST /pages:"
            curl -s -w "\nHTTP %{http_code}\n" -X POST -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" -d '{"build_type":"workflow"}' "https://api.github.com/repos/$R/pages"
            echo "PUT /pages:"
            curl -s -w "\nHTTP %{http_code}\n" -X PUT -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" -d '{"build_type":"workflow"}' "https://api.github.com/repos/$R/pages"
          } >> .ci/status.txt 2>&1

      - name: Upload Pages artifact
        id: up
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Commit source and CI status
        if: always()
        run: |
          mkdir -p .ci
          {
            echo "--- outcomes ---"
            echo "import=${{ steps.import.outcome }} node=${{ steps.node.outcome }} install=${{ steps.install.outcome }} tc=${{ steps.tc.outcome }} build=${{ steps.build.outcome }} pages=${{ steps.pages.outcome }} enable=${{ steps.enable.outcome }} upload=${{ steps.up.outcome }}"
            echo "dist contents: $(ls dist 2>/dev/null | tr '\n' ' ')"
          } >> .ci/status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f .ci/status.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "CI status update [skip ci]"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
