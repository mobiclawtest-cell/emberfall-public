name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import project source
        id: import
        run: |
          set +e
          mkdir -p .ci
          LOG=.ci/status.txt
          : > "$LOG"
          say() { echo "$@" | tee -a "$LOG"; }
          if [ -f src/App.tsx ]; then
            say "Source already present - skipping import."
            echo "imported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          say "Source missing - importing..."
          DEST=/tmp/imported
          rm -rf "$DEST"
          mkdir -p "$DEST"
          OK=""
          for URL in "https://n.uguu.se/kLuqrpol.tar.gz" "https://pomf2.lain.la/f/cpu08ag1.tar.gz" "https://qu.ax/wClA9" "https://filebin.net/emberfall9x7q/ef-src.tar.gz"; do
            say "trying $URL"
            if curl -fsSL --retry 2 --retry-all-errors --max-time 150 -o /tmp/src.tgz "$URL"; then
              say "downloaded $(wc -c < /tmp/src.tgz) bytes"
              if tar xzf /tmp/src.tgz -C "$DEST" 2>>"$LOG"; then
                say "extracted OK"
                OK=1
                break
              else
                say "extract failed"
              fi
            else
              say "download failed"
            fi
          done
          if [ -z "$OK" ]; then
            say "ALL MIRRORS FAILED"
            echo "imported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in index.html tsconfig.json vite.config.ts README.md; do
            if [ -f "$DEST/$f" ]; then cp -f "$DEST/$f" .; say "copied $f"; fi
          done
          rm -rf src
          cp -r "$DEST/src" src
          say "copied src ($(find src -type f | wc -l) files)"
          echo "imported=true" >> "$GITHUB_OUTPUT"
          say "import complete"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build site
        run: npx vite build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Commit source and CI status
        if: always()
        run: |
          mkdir -p .ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f .ci/status.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Import project source [skip ci]"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
